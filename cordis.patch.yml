- insert:
    - id: dsh-plugin-session-http-log
      name: '@local/dsh-plugin-session-http-log'
      config:
        maxRequestsPerSession: 500
        maxSessionBytes: 33554432
        maxRequestBodyBytes: 2097152
        maxResponseBodyBytes: 4194304
        maxLogFileBytes: 67108864
        cleanupOrphans: true
        orphanSweepIntervalMs: 60000
        redactSensitiveHeaders: true
        persist: true
        dataDir: ''
        openDirectoryCommand: ''
